name: Generate Profile Animations and Stats

on:
  # Run automatically every 30 minutes
  schedule:
    - cron: "*/30 * * * *" 
  
  # Allows manual triggering at any time
  workflow_dispatch:
  
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Generate Snake Game SVGs directly in repository root
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JIYA-R5
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Generate an animated language chart from GitHub's repository language API
      - name: Generate Most Used Languages animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-top-languages.js

      # 3. Commit generated profile animations
      - name: Commit and Push Profile Animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg top-languages-3d.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile animations and language stats"
            git push
          fi
