name: Generate Profile Animations and Stats

on:
  # Run automatically every 30 minutes
  schedule:
    - cron: "*/30 * * * *" 
  
  # Allows manual triggering at any time
  workflow_dispatch:
  
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate Snake Game SVGs directly in repository root
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JIYA-R5
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Generate Profile Summary Cards (Stats, Languages, Productive Time)
      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: JIYA-R5
          THEME_NAME: radical

      # 3. Commit Snake Animation SVGs to main branch
      - name: Commit and Push Snake Animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg || true
          git commit -m "Update contribution snake animation" || exit 0
          git push || true
