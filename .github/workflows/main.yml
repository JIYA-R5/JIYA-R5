name: Generate Profile Animations and Stats

on:
  # Run automatically every 30 minutes
  schedule:
    - cron: "*/30 * * * *" 
  
  # Allows manual triggering at any time
  workflow_dispatch:
  
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate Snake Game SVGs directly in repository root
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JIYA-R5
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Generate Profile Summary Cards (Stats, Languages, Productive Time)
      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: JIYA-R5
          THEME_NAME: radical

      - name: Generate animated most-used languages SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate-most-used-languages.py JIYA-R5

      # 4. Commit generated profile SVGs to main branch
      - name: Commit and Push Generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg most-used-languages.svg
          if git diff --cached --quiet; then
            echo "No generated SVG changes to commit."
            exit 0
          fi
          git commit -m "Update profile animations and language stats"
          git push
