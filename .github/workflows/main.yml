name: Generate Profile Animations and Stats

on:
  # Run automatically every 30 minutes
  schedule:
    - cron: "*/30 * * * *" 
  
  # Allows manual triggering at any time
  workflow_dispatch:
  
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Generate Snake Game SVGs from GitHub contribution graph
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JIYA-R5
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Generate Profile Summary Cards (Stats, Languages, Productive Time)
      - name: Generate Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: JIYA-R5
          THEME_NAME: radical

      # 3. Copy generated summary cards into build directory (dist)
      - name: Copy Summary Cards to Build Directory
        run: |
          mkdir -p dist/profile-summary-card-output
          cp -r profile-summary-card-output/* dist/profile-summary-card-output/ || true

      # 4. Push generated SVGs to the 'output' branch
      - name: Push Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

